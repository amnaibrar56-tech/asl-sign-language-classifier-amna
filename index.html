<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Alphabet Classifier — Live Camera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-banner {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            background: white;
            padding: 25px;
            text-align: center;
        }
        video {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 10px;
            border: 3px solid #0d6efd;
            background: #000;
        }
        .result-box {
            background-color: #d1e7dd;
            color: #0f5132;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.25rem;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="header-banner">
            <h2>ASL Alphabet Live Classifier</h2>
            <p class="mb-0">Real-Time Deep Learning Hand Sign Recognition</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card-custom">
                    <h4 class="mb-3">📷 Live Webcam Feed</h4>
                    <p class="text-muted">Click the button below to turn on your camera and show hand signs.</p>
                    
                    <!-- Live Video Element -->
                    <video id="webcam" autoplay playsinline></video>
                    <br><br>
                    
                    <button class="btn btn-primary px-4 py-2 fw-semibold" onclick="startCamera()">Turn On Camera</button>

                    <div id="predictionResult" class="result-box" style="display: none;">
                        Detected Sign: Live Feed Active (Ready)
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function startCamera() {
            const video = document.getElementById('webcam');
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    document.getElementById('predictionResult').style.display = 'block';
                })
                .catch(err => {
                    alert("Camera access denied or not supported by browser!");
                });
        }
    </script>
</body>
</html>
